<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PRODUCT_NAME}} Support</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #e3e7ec;
    --accent: #2f6fed; --accent-text: #ffffff; --user: #2f6fed; --bot: #f0f2f5;
    --warn-bg: #fff6e5; --warn-line: #f0c36b; --err-bg: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa5b3; --line: #2a313a;
      --accent: #5b8def; --user: #3b6fd9; --bot: #222831; --warn-bg: #2d2515; --warn-line: #7a5f22; --err-bg: #3a1f1f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 16px; }
  header { padding: 8px 4px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--accent-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .escalation { background: var(--warn-bg); border: 1px solid var(--warn-line); }
  .error { background: var(--err-bg); }
  .note { display: block; margin-top: 8px; font-size: 13px; color: var(--muted); }
  details { margin-top: 8px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  .source { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--line); }
  .source b { display: block; font-weight: 600; }
  .source q { color: var(--muted); }
  .typing { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  button { padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggestions button { background: var(--panel); color: var(--text); border: 1px solid var(--line); font-weight: 400; padding: 6px 12px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>{{PRODUCT_NAME}} Support</h1>
    <p>Answers come only from the help center, with sources. Anything it can't answer goes to a person.</p>
  </header>
  <div id="log">
    <div class="suggestions" id="suggestions">
      <button type="button">Can I get a refund on my yearly plan?</button>
      <button type="button">Do you accept PayPal?</button>
      <button type="button">How do recurring invoices work?</button>
      <button type="button">Do you integrate with Salesforce?</button>
    </div>
  </div>
  <form id="form">
    <input id="question" autocomplete="off" placeholder="Ask a question…" maxlength="2000" required>
    <button id="send">Send</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const sendButton = document.getElementById("send");
  const history = [];

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function addMessage(node) {
    log.appendChild(node);
    log.scrollTop = log.scrollHeight;
    return node;
  }

  function renderReply(reply) {
    const bubble = el("div", "msg bot" + (reply.kind === "escalation" ? " escalation" : reply.kind === "error" ? " error" : ""), reply.text);
    if (reply.kind === "answer" && reply.citations.length > 0) {
      const details = el("details");
      details.appendChild(el("summary", "", `${reply.citations.length} source${reply.citations.length > 1 ? "s" : ""}`));
      for (const c of reply.citations) {
        const source = el("div", "source");
        source.appendChild(el("b", "", c.title));
        source.appendChild(el("q", "", c.quote));
        details.appendChild(source);
      }
      bubble.appendChild(details);
    }
    if (reply.kind === "escalation") {
      bubble.appendChild(el("span", "note", "A support agent has been notified and will follow up."));
    }
    return bubble;
  }

  async function ask(question) {
    document.getElementById("suggestions")?.remove();
    addMessage(el("div", "msg user", question));
    const typing = addMessage(el("div", "msg bot typing", "Looking it up…"));
    sendButton.disabled = true;
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ question, history: history.slice(-20) }),
      });
      const data = await res.json();
      const reply = res.ok ? data : { kind: "error", text: data.error ?? "Something went wrong." };
      typing.replaceWith(renderReply(reply));
      if (res.ok) history.push({ role: "user", text: question }, { role: "assistant", text: reply.text });
    } catch {
      typing.replaceWith(renderReply({ kind: "error", text: "Can't reach the support server." }));
    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    ask(question);
  });
  document.getElementById("suggestions").addEventListener("click", (event) => {
    if (event.target.tagName === "BUTTON") ask(event.target.textContent);
  });
</script>
</body>
</html>
